name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.2.4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses > /dev/null
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Install dependencies
      run: |
        haxelib setup ~/haxelib
        haxelib install lime 7.0.0
        haxelib install openfl 8.9.7
        haxelib install flixel 6.2.0
        haxelib install flixel-ui 2.2.0
        haxelib install flixel-tools 1.4.1
        haxelib install flixel-addons 2.10.0
        haxelib install hxp 1.3.1
        haxelib set lime 7.0.0
        haxelib set openfl 8.9.7

    - name: Export Android SDK paths
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_ENV

    - name: Build APK
      run: |
        haxelib run lime build android -release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Funkin-Android-APK
        path: export/release/bin/
